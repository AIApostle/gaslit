services:
  - type: web
    name: gaslit-backend
    env: python
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --active uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: UV_PYTHON_DOWNLOADS
        value: auto
